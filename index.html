<script>
const data=JSON.parse(document.getElementById('catalog-data').textContent),byId=id=>document.getElementById(id),v=data.taxonomy.vocabulary;
function option(id,value,text){const o=document.createElement('option');o.value=value;o.textContent=text;byId(id).appendChild(o);return o}
data.categories.forEach(c=>option('category',c.category,c.name));
data.extras.forEach(c=>option('category','extra:'+c.name,c.name));
[['rendering','rendering'],['material','materials']].forEach(([id,key])=>v[key].forEach(t=>option(id,t,t)));
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
const filterMenuMeta={category:{label:'风格分类',description:'按主类或辅助专题查看头像框素材。'},rendering:{label:'画法',description:'选择一种呈现方式筛选素材。'},material:{label:'材质',description:'选择材质查看对应素材。'},usageFilter:{label:'使用状态',description:'筛选已使用或未使用的头像框。'}};
let activeFilterMenu=null,filterMenuPinned=false;
const filterNav=document.querySelector('.filter-nav');
function moveFilterPill(kind){const trigger=filterNav.querySelector('[data-filter-menu="'+kind+'"]');if(!trigger)return;filterNav.style.setProperty('--filter-pill-x',trigger.offsetLeft+'px');filterNav.style.setProperty('--filter-pill-y',trigger.offsetTop+'px');filterNav.style.setProperty('--filter-pill-width',trigger.offsetWidth+'px');filterNav.dataset.pillActive='true'}
function clearFilterPill(){const hoveredOrFocused=filterNav.querySelector('.filter-trigger:hover,.filter-trigger:focus-visible');if(hoveredOrFocused){moveFilterPill(hoveredOrFocused.dataset.filterMenu);return}filterNav.dataset.pillActive='false'}
function syncFilterLabels(){for(const id of Object.keys(filterMenuMeta)){const select=byId(id),selected=select.options[select.selectedIndex],current=byId('current-'+id);if(current)current.textContent=selected?selected.textContent:''}}
function closeFilterMenu(restoreFocus=false){const panel=byId('filterMenu'),previous=activeFilterMenu;panel.hidden=true;document.body.classList.remove('filter-menu-open');document.querySelectorAll('[data-filter-menu]').forEach(button=>button.setAttribute('aria-expanded','false'));activeFilterMenu=null;filterMenuPinned=false;clearFilterPill();if(restoreFocus&&previous){filterNav.querySelector('[data-filter-menu="'+previous+'"]').focus();moveFilterPill(previous)}}
function closeSearchPanel(restoreFocus=false){byId('searchPanel').hidden=true;byId('searchToggle').setAttribute('aria-expanded','false');byId('searchToggle').setAttribute('aria-label','打开搜索');if(restoreFocus)byId('searchToggle').focus()}
function openFilterMenu(kind,pinned=false){const meta=filterMenuMeta[kind],panel=byId('filterMenu');if(!meta)return;closeSearchPanel();if(activeFilterMenu===kind&&!panel.hidden){if(pinned)filterMenuPinned=true;moveFilterPill(kind);return}activeFilterMenu=kind;filterMenuPinned=pinned;const content=node('div',undefined,'filter-menu-content'),heading=node('h2',meta.label,'filter-menu-heading'),description=node('p',meta.description,'filter-menu-description'),options=node('div',undefined,'mega-options');Array.from(byId(kind).options).forEach(option=>{const item=node('button',undefined,'mega-option'),label=node('span',option.textContent,'mega-option-label'),check=node('span',option.value===byId(kind).value?'✓':'','mega-option-check');item.type='button';item.setAttribute('aria-pressed',String(option.value===byId(kind).value));item.append(label,check);item.addEventListener('click',()=>{byId(kind).value=option.value;byId(kind).dispatchEvent(new Event('change',{bubbles:true}));closeFilterMenu(true)});options.appendChild(item)});content.append(heading,description,options);panel.setAttribute('aria-label',meta.label);panel.replaceChildren(content);panel.hidden=false;document.body.classList.add('filter-menu-open');document.querySelectorAll('[data-filter-menu]').forEach(button=>button.setAttribute('aria-expanded',String(button.dataset.filterMenu===kind)));moveFilterPill(kind)}
const filterSystem=byId('filterSystem'),filterMenu=byId('filterMenu'),searchPanel=byId('searchPanel'),searchToggle=byId('searchToggle');
function openSearchPanel(){closeFilterMenu();searchPanel.hidden=false;searchToggle.setAttribute('aria-expanded','true');searchToggle.setAttribute('aria-label','关闭搜索');byId('q').focus()}
searchToggle.addEventListener('click',()=>{if(searchPanel.hidden)openSearchPanel();else closeSearchPanel(true)});
document.querySelectorAll('[data-search-query]').forEach(button=>button.addEventListener('click',()=>{const input=byId('q');input.value=button.dataset.searchQuery;input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}));
document.querySelectorAll('[data-filter-menu]').forEach(button=>{const kind=button.dataset.filterMenu;button.addEventListener('mouseenter',()=>{if(window.matchMedia('(hover: hover)').matches)openFilterMenu(kind)});button.addEventListener('click',()=>{if(activeFilterMenu===kind&&!filterMenu.hidden&&filterMenuPinned)closeFilterMenu();else openFilterMenu(kind,true)})});
filterNav.addEventListener('focusin',event=>{const trigger=event.target.closest('[data-filter-menu]');if(trigger)moveFilterPill(trigger.dataset.filterMenu)});
filterNav.addEventListener('focusout',event=>{if(!filterNav.contains(event.relatedTarget)&&!activeFilterMenu)clearFilterPill()});
window.addEventListener('resize',()=>{if(activeFilterMenu)moveFilterPill(activeFilterMenu)});
filterSystem.addEventListener('mouseleave',()=>{if(window.matchMedia('(hover: hover)').matches&&!filterMenuPinned)closeFilterMenu()});
filterSystem.addEventListener('focusout',event=>{if(!filterSystem.contains(event.relatedTarget)){closeFilterMenu();closeSearchPanel()}});
document.addEventListener('click',event=>{if(!filterSystem.contains(event.target)){closeFilterMenu();closeSearchPanel()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!searchPanel.hidden)closeSearchPanel(true);else if(!filterMenu.hidden)closeFilterMenu(true)}});
const statusStorageKey='avatar-frame-gallery-usage-v1',uploadDbName='avatar-frame-gallery-local-v1';
let usageMap={};try{const saved=JSON.parse(localStorage.getItem(statusStorageKey)||'{}');if(saved&&typeof saved==='object')usageMap=saved}catch{}
let uploadedItems=[];
function usageOf(item){return usageMap[item.id]==='used'?'used':'unused'}
function saveUsage(){try{localStorage.setItem(statusStorageKey,JSON.stringify(usageMap))}catch{}}
function openUploadDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(uploadDbName,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('uploads'))req.result.createObjectStore('uploads',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function readUploads(){const db=await openUploadDb();return new Promise((resolve,reject)=>{const tx=db.transaction('uploads','readonly'),req=tx.objectStore('uploads').getAll();req.onsuccess=()=>{db.close();resolve(req.result||[])};req.onerror=()=>{db.close();reject(req.error)}})}
async function writeUploads(records){const db=await openUploadDb();return new Promise((resolve,reject)=>{const tx=db.transaction('uploads','readwrite'),store=tx.objectStore('uploads');records.forEach(record=>store.put(record));tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error||new Error('本地保存中断'))}})}
function updateLocalUploadOption(){const select=byId('category');[...select.options].filter(o=>o.value==='extra:本地上传').forEach(o=>o.remove());syncFilterLabels()}
async function refreshUploadedItems(){uploadedItems.forEach(i=>URL.revokeObjectURL(i.local_url));const records=await readUploads();uploadedItems=records.map(r=>({id:r.id,title:r.title,source_filename:r.name,collection:'本地上传',local_url:URL.createObjectURL(r.blob),user_selected:false,new_upload:true,secondary_categories:[],rendering:[],materials:[],motifs:[],tags:[r.name],composition:{focal_positions:[],symmetry:'未指定',density:'未指定',structure:'未指定'},classification_reason:'此图片保存在当前浏览器的本地图库中。'}));updateLocalUploadOption()}
function clearFilters(){['q','category','rendering','material','usageFilter'].forEach(id=>byId(id).value='');byId('cross').checked=true;syncFilterLabels();closeFilterMenu()}
const grid=byId('grid');
let cardRevealObserver=null;
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if('IntersectionObserver' in window&&!reducedMotion){cardRevealObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');cardRevealObserver.unobserve(entry.target)}})},{threshold:.12,rootMargin:'0px 0px -36px 0px'})}
function render(animate=true){const category=byId('category').value,query=byId('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean),statusFilter=byId('usageFilter').value,allItems=[...data.items,...uploadedItems];
 let items=allItems.filter(i=>{if(statusFilter&&usageOf(i)!==statusFilter)return false;
  if(category.startsWith('extra:')){if(i.collection!==category.slice(6))return false}else if(category&&i.primary_category!==category&&!(byId('cross').checked&&i.secondary_categories.includes(category)))return false;
  for(const [control,values] of [['rendering',i.rendering],['material',i.materials]]){if(byId(control).value&&!values.includes(byId(control).value))return false}
  const hay=[i.id,i.title,i.source_filename,i.collection||'',...i.tags,i.primary_category||'',...i.secondary_categories].join(' ').toLowerCase();return query.every(t=>hay.includes(t));});
